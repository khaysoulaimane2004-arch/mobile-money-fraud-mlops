name: CI/CD — Build, Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─── JOB 1 : Run tests ───────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  # ─── JOB 2 : Build Docker image ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t fraud-api:latest .

      - name: Verify image runs
        run: |
          docker run -d -p 8080:8080 --name fraud-test fraud-api:latest
          sleep 5
          curl -f http://localhost:8080/health
          docker stop fraud-test
          docker rm fraud-test

      - name: Image build successful
        run: echo "Docker image built and tested successfully"